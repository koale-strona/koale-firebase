<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0d0f12;--surface:#171a20;--border:#292d35;--text:#f1f3f5;--muted:#9298a3;--accent:#8bcf9b}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
header{width:100%;padding:22px 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.logo{font-size:22px;font-weight:800;letter-spacing:-1px}.logo span,h1 span{color:var(--accent)}
.status{font-size:13px;color:var(--muted)}
main{max-width:1000px;margin:auto;padding:54px 20px 70px}
.hero{text-align:center;margin:18px auto 44px}.icon{width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);border-radius:24px;font-size:38px}
h1{font-size:clamp(38px,7vw,58px);font-weight:800;letter-spacing:-2.5px;margin-bottom:12px}.subtitle{color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;transition:.2s;display:flex;flex-direction:column;min-height:210px}
.card:hover{border-color:#444b57;transform:translateY(-2px)}.cardhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.cardicon{width:48px;height:48px;flex:none;border-radius:14px;background:#222a25;display:grid;place-items:center;font-size:24px}
h2{font-size:18px;margin-bottom:5px}.desc{font-size:13px;color:var(--muted);line-height:1.5}
.open{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:auto;padding:14px 18px;border-radius:11px;background:var(--accent);color:#101812;text-decoration:none;border:0;font-weight:750;font-size:14px;cursor:pointer}
.open:hover{background:#a4e2b2}.soon{opacity:.65}.soon .open{background:#292d35;color:#aeb4bf;cursor:default}
footer{padding:22px;text-align:center;color:#656b75;font-size:12px;border-top:1px solid var(--border)}
@media(max-width:600px){header{padding:18px 6%}main{padding-top:34px}.card{padding:19px}}

#portalLogin{min-height:calc(100vh - 75px);display:grid;place-items:center;padding:28px 16px}
.login-card{width:min(100%,430px);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px}
.login-icon{width:64px;height:64px;border-radius:20px;background:#222a25;display:grid;place-items:center;font-size:32px;margin:0 auto 16px}
.login-card h1{text-align:center;font-size:34px;margin-bottom:8px}
.login-sub{color:var(--muted);text-align:center;font-size:14px;margin-bottom:20px}
.login-card label{display:block;color:#c8cbd1;font-size:13px;margin:13px 0 7px}
.login-card input,.login-card select{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--border);background:#101217;color:var(--text);font:inherit}
.login-card input:focus,.login-card select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.login-remember{display:flex!important;align-items:center;gap:9px;color:var(--muted)!important}
.login-remember input{width:auto}
.login-submit{width:100%;border:0;border-radius:11px;padding:14px;margin-top:17px;background:var(--accent);color:#101812;font-weight:750;font-size:15px;cursor:pointer}
.login-submit:disabled{opacity:.6;cursor:wait}
#portalLoginStatus{min-height:20px;margin-top:12px;font-size:13px;color:#ff9292;text-align:center}
#portalLogout{display:none;width:auto;margin-left:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer}
</style></head><body>
<header><div class="logo">koale<span>.</span></div><div style="display:flex;align-items:center"><div class="status" id="topstatus">Zaloguj się</div><button id="portalLogout" type="button">Wyloguj</button></div></header>
<section id="portalLogin">
  <div class="login-card">
    <div class="login-icon">🐨</div>
    <h1>koale<span>.</span></h1>
    <p class="login-sub">Zaloguj się, aby otworzyć swoje aplikacje.</p>
    <form id="portalLoginForm">
      <label for="portalName">Nazwa użytkownika</label>
      <input id="portalName" autocomplete="username" required>
      <label for="portalPassword">Hasło</label>
      <input id="portalPassword" type="password" autocomplete="current-password" required>
      <label for="portalClass">Klasa</label>
      <select id="portalClass"><option value="4">IV</option><option value="5a">Va</option><option value="5b">Vb</option><option value="6" selected>VI</option><option value="7">VII</option><option value="8">VIII</option></select>
      <button id="portalSubmit" class="login-submit" type="submit">Zaloguj się</button>
      <div id="portalLoginStatus" role="status"></div>
    </form>
  </div>
</section>
<main id="home" style="display:none">
<section class="hero"><div class="icon">🐨</div><h1>koale<span>.</span></h1><p class="subtitle">Twoje aplikacje w jednym miejscu.</p></section>
<section class="grid" aria-label="Aplikacje">
<article class="card"><div class="cardhead"><div class="cardicon">📚</div><div><h2>Koale-Zadania</h2><p class="desc">Zadania, odpowiedzi, czat i plan lekcji.</p></div></div><button class="open" id="openTasks">Otwórz Koale-Zadania <span>→</span></button></article>
<article class="card"><div class="cardhead"><div class="cardicon">🎮</div><div><h2>Koale Gry</h2><p class="desc">Gry edukacyjne i zręcznościowe w stylu Koale.</p></div></div><button class="open" id="openGames">Otwórz Koale Gry <span>→</span></button></article>
</section></main>
<footer id="footer" style="display:none">© 2026 Koale</footer>

<script>
document.getElementById('openTasks').addEventListener('click',()=>{
  if (!portalAuth || !portalAuth.token || !portalAuth.user) { portalShowLogin(); return; }
  const handoff = encodeURIComponent(JSON.stringify({token:portalAuth.token,refreshToken:portalAuth.refreshToken,user:portalAuth.user}));
  location.href = 'https://koalezadania.netlify.app/#koale_auth=' + handoff;
});

document.getElementById('openGames').addEventListener('click',()=>{
  if (!portalAuth || !portalAuth.token || !portalAuth.user) { portalShowLogin(); return; }
  const handoff = encodeURIComponent(JSON.stringify({token:portalAuth.token,refreshToken:portalAuth.refreshToken,user:portalAuth.user}));
  location.href = 'https://koalegry.netlify.app/#koale_auth=' + handoff;
});

const PORTAL_SHEETS_API = "https://koalezadania.netlify.app/.netlify/functions/koale-data";
let portalAuth = null;
function portalJsonp(params) {
  return new Promise((resolve, reject) => {
    const cb = "koalePortalCb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    const script = document.createElement("script");
    let finished = false;
    const cleanup = () => { script.remove(); try { delete window[cb]; } catch(e) { window[cb] = undefined; } };
    const timeout = setTimeout(() => { if (finished) return; finished=true; cleanup(); reject(new Error("Google Sheets nie odpowiedział. Sprawdź wdrożenie Apps Script.")); }, 15000);
    window[cb] = data => { if (finished) return; finished=true; clearTimeout(timeout); cleanup(); resolve(data); };
    script.onerror = () => { if (finished) return; finished=true; clearTimeout(timeout); cleanup(); reject(new Error("Nie udało się połączyć z Google Sheets.")); };
    script.src = PORTAL_SHEETS_API + "?" + new URLSearchParams({...params, callback: cb, _: Date.now()}).toString();
    document.head.appendChild(script);
  });
}
function portalStoreAuth(result) {
  const user = {name:String(result.user.name), role:String(result.user.role), class:String(result.user.class || "6")};
  portalAuth = {token:String(result.token), refreshToken:String(result.refreshToken || ""), user};
  sessionStorage.setItem("koale_session", JSON.stringify(user));
  sessionStorage.setItem("koale_apps_script_token", portalAuth.token);
  if (portalAuth.refreshToken) sessionStorage.setItem("koale_firebase_refresh_token", portalAuth.refreshToken);
  portalShowHome();
}
function portalShowHome() {
  document.getElementById("portalLogin").style.display = "none";
  document.getElementById("home").style.display = "block";
  document.getElementById("footer").style.display = "block";
  document.getElementById("portalLogout").style.display = "inline-block";
  document.getElementById("topstatus").textContent = "Witaj, " + portalAuth.user.name;
  history.replaceState(null, "", location.pathname + location.hash);
}
function portalShowLogin(message="") {
  document.getElementById("portalLogin").style.display = "grid";
  document.getElementById("home").style.display = "none";
  document.getElementById("footer").style.display = "none";
  document.querySelector("header").style.display = "flex";
  document.getElementById("portalLogout").style.display = "none";
  document.getElementById("topstatus").textContent = "Zaloguj się";
  document.getElementById("portalLoginStatus").textContent = message;
}
document.getElementById("portalLoginForm").addEventListener("submit", async event => {
  event.preventDefault();
  const submit = document.getElementById("portalSubmit");
  const status = document.getElementById("portalLoginStatus");
  submit.disabled = true;
  submit.textContent = "Sprawdzam dane…";
  status.style.color = "#9298a3";
  status.textContent = "Łączenie z Koale…";
  try {
    const result = await portalJsonp({
      action:"login",
      name:document.getElementById("portalName").value.trim(),
      password:document.getElementById("portalPassword").value,
      class:document.getElementById("portalClass").value
    });
    if (!result || result.success !== true || !result.token || !result.user) {
      throw new Error(result?.error || "Nieprawidłowa nazwa użytkownika lub hasło.");
    }
    portalStoreAuth(result);
    document.getElementById("portalPassword").value = "";
  } catch (error) {
    status.style.color = "#ff9292";
    status.textContent = error.message || "Błąd logowania.";
  } finally {
    submit.disabled = false;
    submit.textContent = "Zaloguj się";
  }
});
document.getElementById("portalLogout").addEventListener("click", async () => {
  const token = portalAuth?.token || localStorage.getItem("koale_apps_script_token") || sessionStorage.getItem("koale_apps_script_token");
  if (token) { try { await portalJsonp({action:"logout", token}); } catch(e) {} }
  ["koale_remembered_session","koale_apps_script_token","koale_firebase_refresh_token"].forEach(k=>localStorage.removeItem(k));
  ["koale_session","koale_apps_script_token","koale_firebase_refresh_token"].forEach(k=>sessionStorage.removeItem(k));
  portalAuth = null;
  portalShowLogin();
});
(function requireLoginOnEveryDirectVisit() {
  ["koale_remembered_session","koale_apps_script_token","koale_firebase_refresh_token"].forEach(k=>localStorage.removeItem(k));
  ["koale_session","koale_apps_script_token","koale_firebase_refresh_token"].forEach(k=>sessionStorage.removeItem(k));
  portalAuth = null;
  portalShowLogin();
})();;
</script></body></html>
